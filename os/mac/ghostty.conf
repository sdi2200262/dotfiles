# Ghostty on macOS.

# Make Option behave as Alt/Meta (Esc-prefixed sequences instead of ç, ®, ...).
# Required for terminal apps that bind Alt-<key>, such as fzf's Alt-C.
macos-option-as-alt = true

# Integrated chrome: traffic lights and tab pills share one slim top row.
macos-titlebar-style = tabs

# Subtle transparency + background blur
background-opacity = 0.95
background-blur-radius = 20

# Move between splits
keybind = super+shift+up=goto_split:up
keybind = super+shift+down=goto_split:down
keybind = super+shift+left=goto_split:left
keybind = super+shift+right=goto_split:right
