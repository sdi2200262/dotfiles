git:
  diffRenderers:
    - colorArg: always
      command: delta --paging=never
gui:
  theme:
    activeBorderColor:
      - "#fabd2f"
      - bold
    inactiveBorderColor:
      - "#a89984"
    optionsTextColor:
      - "#83a598"
    selectedLineBgColor:
      - "#3c3836"
    selectedRangeBgColor:
      - "#3c3836"
    cherryPickedCommitBgColor:
      - "#504945"
    cherryPickedCommitFgColor:
      - "#fabd2f"
    unstagedChangesColor:
      - "#fb4934"
    defaultFgColor:
      - "#ebdbb2"
    authorColors:
      "*": "#d3869b"
    branchColorPatterns:
      ^main(/|$): "#fabd2f"
      ^master(/|$): "#fabd2f"
