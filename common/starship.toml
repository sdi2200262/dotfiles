"$schema" = 'https://starship.rs/config-schema.json'

format = "${env_var.DOTFILES_HOST}${env_var.HC_TERMINAL_ID}$directory$git_branch$character"

add_newline = false
palette = "gruvbox_soft"

[palettes.gruvbox_soft]
fg   = "#ebdbb2"
gray = "#928374"
red  = "#fb4934"

[directory]
style = "fg"
truncation_length = 1
truncate_to_repo = false
truncation_symbol = "../"
read_only = " ro"
read_only_style = "gray"
format = "[$path/]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = ""
style = "gray"
format = "[\\($branch\\)]($style) "

[git_status]
disabled = true

[character]
success_symbol = "[>](fg)"
error_symbol = "[>](red)"
vimcmd_symbol = "[<](fg)"

[cmd_duration]
disabled = true

[python]
disabled = true

[nodejs]
disabled = true

[rust]
disabled = true

[golang]
disabled = true

[package]
disabled = true

[username]
disabled = true

[line_break]
disabled = true

[env_var.HC_TERMINAL_ID]
format = '[hc $env_value]($style) '
style = '#83a598'

[env_var.DOTFILES_HOST]
format = '[$env_value]($style) '
style = "bold #fabd2f"
